<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <rect width="1400" height="720" fill="white"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111} .t{font-size:36px;font-weight:700}.l{font-size:25px}.s{font-size:21px}.gene{stroke:#222;stroke-width:3}.line{stroke:#222;stroke-width:5}.arr{stroke:#222;stroke-width:4;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
