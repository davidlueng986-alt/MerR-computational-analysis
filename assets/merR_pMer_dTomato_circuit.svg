  <polygon points="800,105 960,105 1005,150 960,195 800,195" fill="#55a85a" class="gene"/><text x="850" y="158" class="l">Pmer</text>
  <polygon points="1020,105 1230,105 1275,150 1230,195 1020,195" fill="#cf3d31" class="gene"/><text x="1080" y="158" class="l" fill="white">dTomato</text>
