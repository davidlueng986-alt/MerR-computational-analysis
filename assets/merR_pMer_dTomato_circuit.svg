  <polygon points="130,465 280,465 315,500 280,535 130,535" fill="#3977bb" class="gene"/><text x="185" y="508" class="s">merR</text>
  <ellipse cx="390" cy="455" rx="70" ry="42" fill="#3977bb" stroke="#222" stroke-width="3"/><text x="360" y="463" class="s" fill="white">MerR</text>
  <polygon points="340,485 445,485 480,500 445,515 340,515" fill="#55a85a" class="gene"/>
  <polygon points="485,465 600,465 630,500 600,535 485,535" fill="#cf3d31" class="gene"/><text x="500" y="508" class="s" fill="white">dTomato</text>
  <text x="445" y="405" class="l">Repression</text><path d="M505 420 L545 460 M545 420 L505 460" stroke="#b82424" stroke-width="8"/>
  <text x="225" y="625" class="l">No dTomato (no fluorescent signal)</text>
  <line x1="760" y1="500" x2="1315" y2="500" class="line"/>
  <polygon points="790,465 940,465 975,500 940,535 790,535" fill="#3977bb" class="gene"/><text x="845" y="508" class="s">merR</text>
  <ellipse cx="1035" cy="445" rx="70" ry="42" fill="#3977bb" stroke="#222" stroke-width="3"/><text x="1002" y="453" class="s" fill="white">MerR</text>
  <polygon points="980,485 1085,485 1120,500 1085,515 980,515" fill="#55a85a" class="gene"/>
  <polygon points="1125,465 1260,465 1295,500 1260,535 1125,535" fill="#cf3d31" class="gene"/><text x="1147" y="508" class="s" fill="white">dTomato</text>
  <circle cx="950" cy="380" r="12" fill="#f29b38"/><circle cx="985" cy="365" r="12" fill="#f29b38"/><circle cx="1015" cy="390" r="12" fill="#f29b38"/><text x="880" y="350" class="l">Hg²⁺</text><path d="M980 395 C990 410 1005 420 1020 425" class="arr"/>
  <path d="M1210 445 L1210 380" class="arr"/><text x="1110" y="350" class="l">fluorescent output</text>
